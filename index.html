<style>
:root{
  --bg:#F4F7FB;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --border:#DCE3ED;
  --border-strong:#B8C6D8;
  --ink:#0F1A2A;
  --ink-soft:#4B586E;
  --ink-faint:#7F8FA4;

  --brand:#1E56A0;
  --brand-dark:#143C73;
  --brand-tint:#EBF2FA;
  --amber:#C2872E;
  --danger:#C4433B;
  --danger-tint:#FBEAE9;

  --blue:#1E56A0;
  --blue-bg:#EBF2FA;
  --blue-border:#B8D0EB;

  --green:#288A57;
  --green-bg:#E5F5EC;
  --green-border:#A9DCC1;

  --gray:#8992A0;
  --gray-bg:#EEF0F2;
  --gray-border:#D3D8DD;

  --vivid-red:#FF3B30;
  --vivid-red-dark:#C81E13;
  --vivid-green:#12B76A;
  --vivid-green-dark:#0A7A47;
  --vivid-gray:#9AA5B1;
  --vivid-gray-dark:#717D8A;

  --display: Arial, Helvetica, sans-serif;
  --body: Arial, Helvetica, sans-serif;
  --mono: Arial, Helvetica, sans-serif;

  --radius:10px;
  --shadow-1:0 1px 3px rgba(15,26,42,0.06), 0 1px 2px rgba(15,26,42,0.04);
  --shadow-2:0 8px 24px rgba(15,26,42,0.12), 0 2px 6px rgba(15,26,42,0.08);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img,svg{display:block;max-width:100%;}
button{font-family:inherit;}
a{color:inherit;}

.blueprint-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background-image:
    linear-gradient(rgba(30,86,160,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,86,160,0.04) 1px, transparent 1px);
  background-size:28px 28px;
  background-color:var(--bg);
}

.cloud-bar{
  background: #0f1f38;
  color: #fff;
  font-size: 12px;
  padding: 6px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.cloud-status{
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 600;
}
.pulse-dot{
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--vivid-green);
  display: inline-block;
  box-shadow: 0 0 8px var(--vivid-green);
}
.pulse-dot.offline{
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber);
}
.cloud-actions{
  display: flex;
  gap: 8px;
  align-items: center;
}

.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1180px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px;
}
.brand{
  display:flex; align-items:center; gap:10px;
  cursor:pointer; user-select:none;
}
.brand-mark{
  width:36px;height:36px;border-radius:8px;
  background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight:700; font-size:14px;
  letter-spacing:0.5px;
}
.brand-text{
  font-weight:700; font-size:18px; letter-spacing:0.2px; color:var(--brand-dark);
}
.brand-sub{
  font-size:11px; color:var(--ink-faint); letter-spacing:0.6px; text-transform:uppercase; font-weight:bold;
}
.nav{display:flex; align-items:center; gap:4px;}
.nav a{
  font-size:13.5px; font-weight:600; color:var(--ink-soft);
  padding:8px 14px; border-radius:7px; cursor:pointer; text-decoration:none;
  white-space:nowrap;
  transition: all .15s ease;
}
.nav a:hover{background:var(--brand-tint); color:var(--brand);}
.nav a.active{background:var(--brand); color:#fff;}

.page{max-width:1180px; margin:0 auto; padding:32px 24px 80px;}
.page-narrow{max-width:920px;}

.hero{
  padding:64px 8px 40px;
  text-align:center;
}
.hero-eyebrow{
  font-size:13px; font-weight:bold; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--brand); margin-bottom:14px;
}
.hero h1{
  font-weight:700;
  font-size:clamp(36px,6vw,56px);
  letter-spacing:-0.5px;
  margin:0 0 14px;
  color:var(--ink);
}
.hero p.lead{
  font-size:16.5px; color:var(--ink-soft); max-width:620px; margin:0 auto 8px;
  line-height:1.55;
}
.hero-buildings{
  font-size:13px; color:var(--ink-faint); font-weight:600;
  margin-top:20px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap;
}
.hero-buildings span{display:flex; align-items:center; gap:6px;}
.dot{width:8px;height:8px;border-radius:50%; display:inline-block;}

.tile-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:20px;
  margin-top:48px;
}
@media (max-width:720px){ .tile-grid{grid-template-columns:1fr;} }

.tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:32px 28px;
  cursor:pointer;
  text-align:left;
  position:relative;
  overflow:hidden;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  box-shadow:var(--shadow-1);
}
.tile:hover{ border-color:var(--brand); box-shadow:var(--shadow-2); transform:translateY(-2px); }
.tile-icon{
  width:46px;height:46px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px; margin-bottom:18px;
}
.tile.a .tile-icon{background:var(--brand-tint); color:var(--brand);}
.tile.b .tile-icon{background:var(--blue-bg); color:var(--brand);}
.tile h3{
  font-size:20px; font-weight:700; margin:0 0 8px; letter-spacing:-0.2px; color:var(--ink);
}
.tile p{margin:0; color:var(--ink-soft); font-size:14px; line-height:1.5;}
.tile-cta{
  margin-top:18px; font-size:13.5px; font-weight:700; color:var(--brand);
  display:flex; align-items:center; gap:6px;
}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:24px; box-shadow:var(--shadow-1);
}
.section-title{
  font-weight:700; font-size:22px; margin:0 0 4px; letter-spacing:-0.3px; color:var(--ink);
}
.section-sub{color:var(--ink-soft); font-size:14px; margin:0 0 20px;}

.field-row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}
.field{display:flex; flex-direction:column; gap:6px; min-width:170px;}
.field label{font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px;}
select, input[type=text], input[type=password], textarea{
  font-family:var(--body); font-size:14px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px;
  padding:10px 12px; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
select:focus, input[type=text]:focus, input[type=password]:focus, textarea:focus{
  border-color:var(--brand); box-shadow:0 0 0 3px rgba(30,86,160,0.15);
}
textarea{resize:vertical; min-height:90px; font-size:13px;}

.btn{
  font-size:13.5px; font-weight:700; border-radius:8px; border:1px solid transparent;
  padding:10px 18px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  transition:filter .12s ease, transform .05s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:disabled{background:var(--gray); cursor:not-allowed;}
.btn-outline{background:#fff; border-color:var(--border-strong); color:var(--ink);}
.btn-outline:hover{border-color:var(--brand); color:var(--brand);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; color:var(--ink-soft); border-color:transparent;}
.btn-ghost:hover{background:var(--gray-bg);}
.btn-sm{padding:6px 12px; font-size:12.5px;}

.result-group{margin-bottom:22px;}
.result-group-title{
  font-size:13px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase;
  color:var(--brand-dark); margin-bottom:10px; padding-bottom:6px; border-bottom:1px dashed var(--border-strong);
}
.result-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px;}
.result-item{
  border:1px solid var(--border); background:var(--surface); border-radius:10px;
  padding:14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.result-item .code{font-weight:700; font-size:14px; color:var(--ink);}
.result-item .cap{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.empty-note{
  padding:26px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
  border:1px dashed var(--border-strong); border-radius:12px; background:var(--surface-2);
}

.floor-toolbar{
  display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between;
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:18px 20px; margin-bottom:18px; position:sticky; top:70px; z-index:20; box-shadow:var(--shadow-1);
}
.building-tabs{display:flex; flex-direction:column; gap:8px;}
.tab-group{display:flex; gap:4px; align-items:center;}
.tab-group-label{font-size:12px; font-weight:700; color:var(--ink-faint); width:54px; letter-spacing:0.4px;}
.tab-btn{
  font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink-soft); cursor:pointer;
}
.tab-btn.active{background:var(--brand); color:#fff; border-color:var(--brand);}
.tab-btn:hover:not(.active){border-color:var(--brand); color:var(--brand);}

.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.legend-item{display:flex; align-items:center; gap:6px;}
.legend-swatch{width:13px;height:13px;border-radius:3px; border:1px solid rgba(0,0,0,0.08);}

.floor-svg-wrap{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px;
  overflow:auto; box-shadow:var(--shadow-1);
}
.room-shape{cursor:pointer; transition:filter .1s ease;}
.room-shape:hover{filter:brightness(0.96);}
.room-label-code{font-weight:700; pointer-events:none; user-select:none;}
.room-label-sub{font-weight:normal; pointer-events:none; user-select:none;}

.denah-shell{display:flex; align-items:stretch; gap:10px;}
.denah-nav-btn{
  flex:0 0 auto; align-self:center;
  width:46px; height:46px; border-radius:50%;
  background:var(--brand); color:#fff; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:18px;
  box-shadow:var(--shadow-2);
  transition:filter .12s ease, transform .08s ease;
}
.denah-nav-btn:hover{filter:brightness(1.15);}
.denah-nav-btn:active{transform:scale(0.94);}
.denah-nav-btn:disabled{background:var(--gray-border); color:var(--ink-faint); cursor:not-allowed; box-shadow:none;}
.denah-title{
  text-align:center; font-weight:700; font-size:20px;
  letter-spacing:-0.2px; margin-bottom:14px; color:var(--brand-dark);
}

.overlay{
  position:fixed; inset:0; background:rgba(15,26,42,0.5); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal{
  background:#fff; border-radius:16px; max-width:440px; width:100%;
  box-shadow:var(--shadow-2); overflow:hidden; max-height:90vh; display:flex; flex-direction:column;
}
.modal-head{
  padding:20px 22px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start;
}
.modal-head h3{font-size:18px; margin:0; font-weight:700;}
.modal-close{cursor:pointer; color:var(--ink-faint); font-size:18px; line-height:1; padding:4px; border:none; background:none;}
.modal-body{padding:20px 22px; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

.kv{display:grid; grid-template-columns:110px 1fr; gap:8px 10px; font-size:13.5px; margin-bottom:6px;}
.kv b{color:var(--ink-soft); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.3px;}
.kv span{font-size:13.5px; font-weight:600;}
.ticket{
  border:1px dashed var(--border-strong); border-radius:10px; padding:14px 16px; margin-bottom:16px; background:var(--surface-2);
}
.msg-error{
  background:var(--danger-tint); color:var(--danger); border:1px solid #F0C6C3;
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px;
}
.msg-success{
  background:var(--green-bg); color:var(--green); border:1px solid var(--green-border);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px;
}

.admin-shell{display:grid; grid-template-columns:200px 1fr; gap:24px;}
@media (max-width:820px){ .admin-shell{grid-template-columns:1fr;} }
.admin-nav{display:flex; flex-direction:column; gap:2px;}
.admin-nav button{
  text-align:left; background:none; border:none; padding:10px 12px; border-radius:8px; cursor:pointer;
  font-size:13.5px; color:var(--ink-soft); font-weight:600;
}
.admin-nav button.active{background:var(--brand-tint); color:var(--brand); font-weight:700;}
.admin-nav button:hover:not(.active){background:var(--gray-bg);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--border);}
th{font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-faint); font-weight:700;}
.table-wrap{overflow-x:auto;}
.tag{
  font-size:11px; padding:2px 7px; border-radius:5px; font-weight:700;
}
.tag.active{background:var(--green-bg); color:var(--green);}
.tag.cancelled{background:var(--gray-bg); color:var(--ink-faint);}

.gate{max-width:380px; margin:60px auto; text-align:center; padding:32px 28px;}
.gate .btn{margin-top:14px;}

.footer-note{
  text-align:center; color:var(--ink-faint); font-size:13px; margin-top:60px; font-weight:600;
}
::selection{background:var(--brand); color:#fff;}
</style>
</head>

let ROOMS = [];
let FLOORS = [];

function buildDemoData(){
  FLOORS = [];
  ROOMS = [];
  BUILDINGS.forEach(b=>{
    const nFloors = FLOOR_COUNTS[b.code] || 4;
    for(let n=1;n<=nFloors;n++){
      const floorId = `${b.code}-${n}`;
      FLOORS.push({id:floorId, buildingCode:b.code, number:n, name:`Lantai ${n}`});
      const layout = FLOOR_LAYOUTS[floorId] || {left:[], right:[]};
      let orderCounter = 0;
      ['left','right'].forEach(side=>{
        layout[side].forEach((item, idx)=>{
          orderCounter++;
          if(item.blank){
            ROOMS.push({
              id:`${floorId}-${side==='left'?'L':'R'}${idx}`,
              floorId, buildingCode:b.code, floorNumber:n,
              side, sideIndex:idx, order:orderCounter,
              room_code:'', room_name:'', room_type:'blank',
              is_bookable:false, span:item.span||1, kind:'blank',
            });
            return;
          }
          const isClassroom = !!item.bookable;
          const code = isClassroom ? item.name.toUpperCase() : item.name;
          ROOMS.push({
            id:`${floorId}-${side==='left'?'L':'R'}${idx}`,
            floorId, buildingCode:b.code, floorNumber:n,
            side, sideIndex:idx, order:orderCounter,
            room_code:code,
            room_name:item.name,
            room_type: isClassroom ? 'classroom' : 'fixed',
            is_bookable: isClassroom,
            span:item.span||1,
            kind: item.label ? 'label' : 'room',
          });
        });
      });
    }
  });
}
buildDemoData();

function roomsOfFloor(floorId){ return ROOMS.filter(r=>r.floorId===floorId); }
function findRoom(id){ return ROOMS.find(r=>r.id===id); }

function roomIdByLabel(buildingCode, floorNumber, label){
  const clean = label.replace(/\s+/g, '').toLowerCase();
  const r = ROOMS.find(r=>r.buildingCode===buildingCode && r.floorNumber===floorNumber && r.room_name.replace(/\s+/g, '').toLowerCase()===clean);
  return r ? r.id : null;
}

const DEFAULT_FIREBASE_URL = "https://sirona-fst-default-rtdb.firebaseio.com";
let currentDbUrl = localStorage.getItem('sirona_firebase_db_url') || DEFAULT_FIREBASE_URL;
let dbRef = null;
let isCloudOnline = false;

// BroadcastChannel untuk sinkronisasi antar-tab pada perangkat yang sama
const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('sirona_sync_channel') : null;
if(syncChannel){
  syncChannel.onmessage = (msg) => {
    if(msg.data && msg.data.type === 'DATA_UPDATED'){
      if(msg.data.bookings) BOOKINGS = msg.data.bookings;
      if(msg.data.schedules) SCHEDULES = msg.data.schedules;
      render();
    }
  };
}

function initFirebaseSync(){
  try {
    if(firebase.apps.length === 0){
      firebase.initializeApp({
        databaseURL: currentDbUrl
      });
    }
    const db = firebase.database();
    dbRef = db.ref('sirona_data');

    // Listener realtime dari server
    dbRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if(val){
        if(val.bookings) BOOKINGS = val.bookings;
        if(val.schedules) SCHEDULES = val.schedules;
        updateCloudStatus(true, 'Cloud Sync: Terhubung (Sinkronisasi Multi-Device Aktif)');
        render();
      } else {
        // Inisialisasi awal ke server jika data cloud masih kosong
        pushToCloud();
      }
    }, (err) => {
      console.warn("Koneksi Firebase offline/dibatasi:", err);
      updateCloudStatus(false, 'Cloud Sync: Mode Lokal (Klik pengaturan untuk set Database)');
    });

    // Cek status koneksi
    db.ref('.info/connected').on('value', (snap) => {
      if(snap.val() === true){
        updateCloudStatus(true, 'Cloud Sync: Terhubung (Data Terintegrasi Antar-Device)');
      } else {
        updateCloudStatus(false, 'Cloud Sync: Menghubungkan ke Cloud...');
      }
    });

  } catch(e) {
    console.warn("Init Firebase Gagal:", e);
    updateCloudStatus(false, 'Cloud Sync: Offline (Klik Pengaturan)');
  }
}

function updateCloudStatus(isOnline, text){
  isCloudOnline = isOnline;
  const dot = document.getElementById('cloud-dot');
  const txt = document.getElementById('cloud-status-text');
  if(dot) dot.className = isOnline ? 'pulse-dot' : 'pulse-dot offline';
  if(txt) txt.textContent = text;
}

function pushToCloud(){
  // Simpan ke Firebase Realtime DB
  if(dbRef){
    dbRef.set({
      bookings: BOOKINGS,
      schedules: SCHEDULES,
      updated_at: new Date().toISOString()
    }).catch(err => console.error("Gagal push ke Firebase:", err));
  }
  // Simpan ke LocalStorage cadangan
  localStorage.setItem('sirona_local_bookings', JSON.stringify(BOOKINGS));
  localStorage.setItem('sirona_local_schedules', JSON.stringify(SCHEDULES));

  // Broadcast ke tab lain
  if(syncChannel){
    syncChannel.postMessage({
      type: 'DATA_UPDATED',
      bookings: BOOKINGS,
      schedules: SCHEDULES
    });
  }
}

/* ================= STATUS & KETERSEDIAAN RUANGAN ================= */
function getRoomStatus(room, day, slotId){
  if(!room.is_bookable){
    return {status:'RED', room};
  }
  const sched = SCHEDULES.find(s=>s.room_id===room.id && s.day===day && s.time_slot_id===slotId && s.status==='active');
  if(sched) return {status:'GREEN', room, source:'schedule', data:sched};
  const bk = BOOKINGS.find(b=>b.room_id===room.id && b.day===day && b.time_slot_id===slotId && b.status==='active');
  if(bk) return {status:'GREEN', room, source:'booking', data:bk};
  return {status:'GRAY', room};
}

function getRoomStatusRange(room, day, startSlot, endSlot){
  if(!room.is_bookable){
    return {status:'RED', room};
  }
  const start = Math.min(startSlot, endSlot);
  const end = Math.max(startSlot, endSlot);
  for(let s = start; s <= end; s++){
    const st = getRoomStatus(room, day, s);
    if(st.status === 'GREEN'){
      return st; // Tampilkan terpakai jika ada salah satu slot terisi
    }
  }
  return {status:'GRAY', room};
}

function isRoomFree(room, day, slotId){
  return room.is_bookable && getRoomStatus(room, day, slotId).status === 'GRAY';
}

function isRoomFreeRange(room, day, startSlot, endSlot){
  if(!room.is_bookable) return false;
  const start = Math.min(startSlot, endSlot);
  const end = Math.max(startSlot, endSlot);
  for(let s = start; s <= end; s++){
    if(!isRoomFree(room, day, s)) return false;
  }
  return true;
}

function slotRangeLabel(startId, endId){

  if(!s || !e) return '';

function esc(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function buildingName(code){ return BUILDINGS.find(b=>b.code===code)?.name || code; }

function splitRoomText(text, maxCharsPerLine = 12) {
  if (text.includes('\n')) return text.split('\n');
  if (text.length <= maxCharsPerLine) return [text];
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(word => {
    if (!current) {
      current = word;
    } else if ((current + ' ' + word).length <= maxCharsPerLine) {
      current += ' ' + word;
    } else {
      lines.push(current);
      current = word;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function renderFloor(){
  const f = state.floor;
  const floorId = `${f.building}-${f.number}`;
  const buildingObj = BUILDINGS.find(b=>b.code===f.building);
  const maxFloor = FLOOR_COUNTS[f.building] || 1;

  const leftRooms = roomsOfFloor(floorId).filter(r=>r.side==='left').sort((a,b)=>a.sideIndex-b.sideIndex);
  const rightRooms = roomsOfFloor(floorId).filter(r=>r.side==='right').sort((a,b)=>a.sideIndex-b.sideIndex);

  const AREA_X = 20, AREA_W = 860, GAP = 14;
  const ROW_TOP_Y = 20, ROW_H = 150;
  const CORRIDOR_Y = ROW_TOP_Y + ROW_H + 24, CORRIDOR_H = 76;
  const ROW_BOTTOM_Y = CORRIDOR_Y + CORRIDOR_H + 24;
  const VB_W = AREA_X*2 + AREA_W;
  const VB_H = ROW_BOTTOM_Y + ROW_H + 20;

  function rowBoxes(rooms, y){
    const totalUnits = rooms.reduce((sum,r)=>sum+(r.span||1), 0) || 1;
    const unitW = (AREA_W - (totalUnits-1)*GAP) / totalUnits;
    let cursorX = AREA_X;
    return rooms.map((room)=>{
      const span = room.span || 1;
      const w = unitW*span + GAP*(span-1);
      const x = cursorX;
      cursorX += w + GAP;

      if(room.kind==='blank') return '';
      // Status ruangan dievaluasi pada rentang jam mulai s.d. selesai
      const st = getRoomStatusRange(room, f.day, f.slotStart, f.slotEnd);
      const c = STATUS_COLORS[st.status];
      let subLabel = '';
      if(st.status==='GREEN' && st.data) subLabel = st.data.class_name;

      const maxChar = span > 1 ? 24 : 11;
      const lines = splitRoomText(room.room_name, maxChar);
      const fontSize = lines.length > 2 ? 10.5 : (room.room_name.length > 10 ? 11.5 : 13);
      const lineHeight = fontSize + 4;
      const totalBlockHeight = (lines.length * lineHeight) + (subLabel ? 16 : 0);
      const startY = y + (ROW_H - totalBlockHeight) / 2 + fontSize;

      const tspans = lines.map((line, i) => 
        `<tspan x="${x + w / 2}" y="${startY + (i * lineHeight)}">${esc(line)}</tspan>`
      ).join('');

      const subLabelSvg = subLabel ? 
        `<text x="${x + w / 2}" y="${startY + (lines.length * lineHeight) + 6}" text-anchor="middle" class="room-label-sub" font-size="10.5" fill="${c.text}">${esc(subLabel)}</text>` 
        : '';

      if(room.kind==='label'){
        return `
        <g class="room-shape" data-room="${room.id}" data-status="${st.status}">
          <rect x="${x}" y="${y}" width="${w}" height="${ROW_H}" rx="10" fill="transparent" stroke="none"></rect>
          <text text-anchor="middle" class="room-label-code" font-size="${fontSize}" fill="var(--ink)">${tspans}</text>
        </g>`;
      }

      return `
      <g class="room-shape" data-room="${room.id}" data-status="${st.status}">
        <rect x="${x}" y="${y}" width="${w}" height="${ROW_H}" rx="18"
          fill="${c.fill}" stroke="${c.stroke}" stroke-width="1.5"></rect>
        <text text-anchor="middle" class="room-label-code" font-size="${fontSize}" fill="${c.text}">
          ${tspans}
        </text>
        ${subLabelSvg}
      </g>`;
    }).join('');
  }

  const svgRooms = rowBoxes(leftRooms, ROW_TOP_Y) + rowBoxes(rightRooms, ROW_BOTTOM_Y);

  const corridorSvg = `<rect x="${AREA_X}" y="${CORRIDOR_Y}" width="${AREA_W}" height="${CORRIDOR_H}" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="8 6" rx="30"></rect>
    <text x="${AREA_X+AREA_W/2}" y="${CORRIDOR_Y+CORRIDOR_H/2+5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-soft)">KORIDOR</text>`;

  const buildingTabs = BUILDINGS.map(b=>`
    <div class="tab-group">
      <div class="tab-group-label">${b.code}</div>
      ${Array.from({length:FLOOR_COUNTS[b.code]||1},(_,i)=>i+1).map(n=>`<button class="tab-btn ${b.code===f.building && n===f.number?'active':''}" data-floor-nav="${b.code}:${n}">L${n}</button>`).join('')}
    </div>
  `).join('');

  const prevDisabled = f.number<=1 ? 'disabled' : '';
  const nextDisabled = f.number>=maxFloor ? 'disabled' : '';

  return `
  <div class="page">
    <div class="section-title">Denah Ruangan</div>
    <p class="section-sub">${esc(buildingObj.name)} · ${esc(buildingObj.faculty)} · Lantai ${f.number} dari ${maxFloor}</p>

    <div class="floor-toolbar">
      <div class="building-tabs">${buildingTabs}</div>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field">
          <label for="floor-day">Hari</label>
          <select id="floor-day">

      <button class="btn btn-danger" data-confirm-cancel data-room="${m.room.id}" data-source="${m.source}" data-sid="${m.sid}">Ya, Batalkan</button>

/* ================= EVENT HANDLING ================= */
function attachGlobalListeners(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const r = el.getAttribute('data-nav');
      if(r==='search') setState({route:'search', modal:null, search:{...state.search, done:false}});
      else if(r==='floor') navigate('floor');
      else navigate(r);
    });
  });

  const btnCloudCfg = document.getElementById('btn-cloud-config');
  if(btnCloudCfg){
    btnCloudCfg.addEventListener('click', ()=>{
      setState({modal:{type:'cloud-settings'}});
    });
  }

  const btnSaveCloud = document.getElementById('btn-save-cloud-config');
  if(btnSaveCloud){
    btnSaveCloud.addEventListener('click', ()=>{
      const val = document.getElementById('cfg-firebase-url')?.value.trim();
      if(val){
        currentDbUrl = val;
        localStorage.setItem('sirona_firebase_db_url', val);
        initFirebaseSync();
      }
      setState({modal:null});
    });
  }

  // Event Pemesanan (Search Page)
  const searchDay = document.getElementById('search-day');
  const searchSlotStart = document.getElementById('search-slot-start');
  const searchSlotEnd = document.getElementById('search-slot-end');
  const errBox = document.getElementById('search-validation-error');

  if(searchDay) searchDay.addEventListener('change', e=>setState({search:{...state.search, day:e.target.value, done:false}}));
  if(searchSlotStart) searchSlotStart.addEventListener('change', e=>{
    setState({search:{...state.search, slotStart:Number(e.target.value), done:false}});
  });
  if(searchSlotEnd) searchSlotEnd.addEventListener('change', e=>{
    setState({search:{...state.search, slotEnd:Number(e.target.value), done:false}});
  });

  const btnSearch = document.getElementById('btn-search-rooms');
  if(btnSearch) btnSearch.addEventListener('click', ()=>{
    if(state.search.slotStart > state.search.slotEnd){
      if(errBox){
        errBox.textContent = 'Jam Mulai Matkul tidak boleh lebih besar dari Jam Selesai Matkul.';
        errBox.style.display = 'block';
      }
      return;
    }
    if(errBox) errBox.style.display = 'none';
    setState({search:{...state.search, done:true}});
  });

  document.querySelectorAll('[data-book-room]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const room = findRoom(el.getAttribute('data-book-room'));
      openBookModal(room, el.getAttribute('data-book-day'), Number(el.getAttribute('data-book-start')), Number(el.getAttribute('data-book-end')));
    });
  });

  // Event Denah (Floor Page dengan Jam Mulai & Jam Selesai)
  const floorDay = document.getElementById('floor-day');
  const floorSlotStart = document.getElementById('floor-slot-start');
  const floorSlotEnd = document.getElementById('floor-slot-end');
  const floorErrBox = document.getElementById('floor-validation-error');

  if(floorDay) floorDay.addEventListener('change', e=>setState({floor:{...state.floor, day:e.target.value}}));
  if(floorSlotStart) floorSlotStart.addEventListener('change', e=>{
    const val = Number(e.target.value);
    if(val > state.floor.slotEnd){
      if(floorErrBox){
        floorErrBox.textContent = 'Jam Mulai Matkul tidak boleh lebih besar dari Jam Selesai Matkul.';
        floorErrBox.style.display = 'block';
      }
    } else {
      if(floorErrBox) floorErrBox.style.display = 'none';
    }
    setState({floor:{...state.floor, slotStart:val}});
  });
  if(floorSlotEnd) floorSlotEnd.addEventListener('change', e=>{
    const val = Number(e.target.value);
    if(state.floor.slotStart > val){
      if(floorErrBox){
        floorErrBox.textContent = 'Jam Mulai Matkul tidak boleh lebih besar dari Jam Selesai Matkul.';
        floorErrBox.style.display = 'block';
      }
    } else {
      if(floorErrBox) floorErrBox.style.display = 'none';
    }
    setState({floor:{...state.floor, slotEnd:val}});
  });

  document.querySelectorAll('[data-floor-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [b,n] = el.getAttribute('data-floor-nav').split(':');
      setState({floor:{...state.floor, building:b, number:Number(n)}});
    });
  });

  document.querySelectorAll('[data-floor-slide]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const dir = el.getAttribute('data-floor-slide');
      const f = state.floor;
      const maxFloor = FLOOR_COUNTS[f.building] || 1;
      let next = f.number + (dir==='next' ? 1 : -1);
      if(next < 1) next = 1;
      if(next > maxFloor) next = maxFloor;
      if(next === f.number) return;
      setState({floor:{...f, number:next}});
    });
  });

  // Klik ruangan pada denah (otomatis mengambil rentang jam mulai-selesai yang dipilih pada denah)
  document.querySelectorAll('.room-shape').forEach(el=>{
    el.addEventListener('click', ()=>{
      const room = findRoom(el.getAttribute('data-room'));
      const status = el.getAttribute('data-status');
      const f = state.floor;

  document.querySelectorAll('[data-cancel-booking-admin]').forEach(el=>{

  const importTa = document.getElementById('import-textarea');

  const fileInput = document.getElementById('import-file-input');
  if(fileInput){
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      const fnEl = document.getElementById('import-file-name');
      if(file && fnEl){
        fnEl.textContent = `${file.name} (${(file.size/1024).toFixed(1)} KB)`;
      }

  }

  const importValidate = document.querySelector('[data-import-validate]');
  if(importValidate){
    importValidate.addEventListener('click', async ()=>{
      if(state.importMethod === 'file'){
        const file = fileInput ? fileInput.files[0] : null;
        if(!file){

        try {
          const rawRows = await parseImportFile(file);

  const importCommit = document.querySelector('[data-import-commit]');
  if(importCommit) importCommit.addEventListener('click', ()=>{

        class_name:r.class_name, course_name:r.course_name,
        lecturer:r.lecturer, status:'active',
      });
    });
    pushToCloud();
    setState({importText:'', importPreview:null, adminTab:'jadwal'});

}

function openBookModal(room, day, startSlot, endSlot){
  const start = Math.min(startSlot, endSlot);
  const end = Math.max(startSlot, endSlot);
  if(!isRoomFreeRange(room, day, start, end)){
    setState({modal:{type:'book', room, day, start, end}, bookingError:'Maaf, ruangan baru saja digunakan atau dipesan pada rentang jam tersebut.'});
    return;
  }
  setState({modal:{type:'book', room, day, start, end}, bookingError:'', bookingForm:{kelas:'',matkul:'',dosen:''}});
}

/* ---------------- PARSER JAM ---------------- */
function parseSlotRange(jamStr){
  if(!jamStr) return null;
  const clean = jamStr.toString().trim().replace(/\s+/g, '');
  
  const numRangeMatch = clean.match(/^(\d{1,2})(?:-|sd|\.\.)(\d{1,2})$/i);
  if(numRangeMatch){
    const s = parseInt(numRangeMatch[1], 10);
    const e = parseInt(numRangeMatch[2], 10);
    if(s >= 1 && e <= 11 && s <= e){
      return {start:s, end:e};
    }
  }

  const singleNumMatch = clean.match(/^(\d{1,2})$/);
  if(singleNumMatch){
    const s = parseInt(singleNumMatch[1], 10);
    if(s >= 1 && s <= 11) return {start:s, end:s};
  }

  const timeRangeMatch = clean.match(/(\d{1,2})[.:](\d{2})(?:-|sd)(\d{1,2})[.:](\d{2})/i);
  if(timeRangeMatch){
    const tStart = `${timeRangeMatch[1].padStart(2,'0')}.${timeRangeMatch[2]}`;
    const tEnd = `${timeRangeMatch[3].padStart(2,'0')}.${timeRangeMatch[4]}`;
    const sObj = TIME_SLOTS.find(t=>t.start === tStart);
    const eObj = TIME_SLOTS.find(t=>t.end === tEnd);
    if(sObj && eObj && sObj.id <= eObj.id){
      return {start:sObj.id, end:eObj.id};
    }
  }

  return null;
}

/* ---------------- PARSER FILE ---------------- */
async function parseImportFile(file){
  const ext = file.name.split('.').pop().toLowerCase();

  if(ext === 'xlsx' || ext === 'xls'){
    if(typeof XLSX === 'undefined') throw new Error('Library SheetJS belum siap dimuat.');
    const arrayBuffer = await file.arrayBuffer();
    const wb = XLSX.read(arrayBuffer, {type:'array'});
    const sheetName = wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const rawData = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    return rawData.filter(row => row.some(cell => String(cell).trim().length > 0));
  }

  if(ext === 'pdf'){
    if(typeof pdfjsLib === 'undefined') throw new Error('Library PDF.js belum siap dimuat.');
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    let fullText = '';
    for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
      const page = await pdf.getPage(pageNum);
      const content = await page.getTextContent();
      let lastY, textLine = '';
      for(const item of content.items){
        if(lastY !== undefined && Math.abs(item.transform[5] - lastY) > 5){
          fullText += textLine + '\n';
          textLine = '';
        }
        textLine += (textLine ? ',' : '') + item.str;
        lastY = item.transform[5];
      }
      if(textLine) fullText += textLine + '\n';
    }
    return parseImportText(fullText);
  }

  const text = await file.text();
  return parseImportText(text);
}

function parseImportText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  return lines.map(line => {
    if(line.includes('\t')) return line.split('\t').map(c=>c.trim());
    if(line.includes(';')) return line.split(';').map(c=>c.trim());
    return line.split(',').map(c=>c.trim());
  });
}

/* ---------------- VALIDASI DATA IMPOR ---------------- */
function validateImportRows(rawRows){
  const errors = [];
  const rows = [];
  if(!rawRows || rawRows.length === 0){
    return {rows, errors:['Tidak ada baris data yang ditemukan untuk divalidasi.']};
  }

  let startIdx = 0;
  const firstRowStr = (rawRows[0] || []).join(' ').toLowerCase();
  if(firstRowStr.includes('gedung') || firstRowStr.includes('hari') || firstRowStr.includes('ruang')){
    startIdx = 1;
  }

  for(let i = startIdx; i < rawRows.length; i++){
    const cols = rawRows[i].map(c=>String(c).trim());
    const lineNo = i + 1;
    if(cols.length < 8){
      errors.push(`Baris ${lineNo}: kolom tidak lengkap (butuh 8 kolom: Gedung, Lantai, Ruang, Hari, Jam Mulai-Akhir, Kelas, MK, Dosen. Ditemukan ${cols.length} kolom).`);
      continue;
    }

    const [gedung, lantai, ruang, hari, jamStr, kelas, mataKuliah, dosen] = cols;
    const bcode = gedung.toUpperCase();
    if(!BUILDINGS.find(b=>b.code===bcode)){
      errors.push(`Baris ${lineNo}: gedung "${gedung}" tidak terdaftar (gunakan FST atau FTIK).`); continue;
    }
    if(!DAYS.includes(hari)){
      errors.push(`Baris ${lineNo}: hari "${hari}" tidak valid.`); continue;
    }

    const slotRange = parseSlotRange(jamStr);
    if(!slotRange){
      errors.push(`Baris ${lineNo}: format jam "${jamStr}" tidak valid. Gunakan format seperti "1-3", "2", atau "07.00-09.30".`);
      continue;
    }

    const room = ROOMS.find(r=>r.room_code.replace(/\s+/g,'').toLowerCase() === ruang.replace(/\s+/g,'').toLowerCase() && r.buildingCode === bcode);
    if(!room){
      errors.push(`Baris ${lineNo}: ruangan "${ruang}" tidak ditemukan di gedung ${gedung}.`); continue;
    }
    if(!room.is_bookable){
      errors.push(`Baris ${lineNo}: ruangan "${ruang}" bertipe fasilitas/kantor dan tidak dapat dijadwalkan.`); continue;
    }
    if(!kelas || !mataKuliah || !dosen){
      errors.push(`Baris ${lineNo}: kelas, mata kuliah, dan dosen tidak boleh kosong.`); continue;
    }

    let hasConflict = false;
    for(let s = slotRange.start; s <= slotRange.end; s++){
      const clash = SCHEDULES.some(sc=>sc.room_id===room.id && sc.day===hari && sc.time_slot_id===s && sc.status==='active')
        || rows.some(r=>r.room_id===room.id && r.day===hari && r.slot===s);
      if(clash){
        errors.push(`Baris ${lineNo}: bentrok, ruangan "${ruang}" sudah terisi pada ${hari} jam ke ${s}.`);
        hasConflict = true;
        break;
      }
    }
    if(hasConflict) continue;

    for(let s = slotRange.start; s <= slotRange.end; s++){
      rows.push({
        room_id: room.id,
        room_code: room.room_code,
        day: hari,
        slot: s,
        class_name: kelas,
        course_name: mataKuliah,
        lecturer: dosen
      });
    }
  }

  return {rows, errors};
}
